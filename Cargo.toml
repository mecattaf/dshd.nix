[package]
name = "dshd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Durable native DSH sessions on NixOS: a lifecycle CLI and per-instance runner over the systemd user manager"
license = "Apache-2.0"
repository = "https://github.com/mecattaf/dshd.nix"
publish = false

[dependencies]
# Signal masking and the one kill(2) of the runner's own child live in src/sys.rs.
libc = "0.2" # gate: allow R2 (the only unsafe surface, confined to src/sys.rs)
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
indexing_slicing = "warn"
string_slice = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
